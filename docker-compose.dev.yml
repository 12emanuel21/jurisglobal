# Overlay de DESARROLLO (hot-reload). Se usa con: make dev
# Publica puertos de depuración SOLO en 127.0.0.1 (nunca hacia la red).

services:
  db:
    ports: ["127.0.0.1:55432:5432"]

  redis:
    ports: ["127.0.0.1:56379:6379"]

  api:
    build:
      target: dev
    restart: "no"
    environment:
      NODE_ENV: development
    ports: ["127.0.0.1:4100:4000"]
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads

  web:
    build:
      target: dev
    restart: "no"
    environment:
      BACKEND_INTERNAL_URL: http://api:4000
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:3100:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
