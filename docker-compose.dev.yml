# Overlay de DESARROLLO (hot-reload). Se usa con: make dev
# Publica puertos de depuración SOLO en 127.0.0.1 (nunca hacia la red).

services:
  db:
    ports: ["127.0.0.1:55432:5432"]

  redis:
    ports: ["127.0.0.1:56379:6379"]

  # Imágenes de desarrollo con nombre propio: `./jg build` (producción) ya no las sobrescribe
  api:
    image: jurisglobal-api-dev
    build:
      target: dev
    restart: "no"
    environment:
      NODE_ENV: development
    ports: ["127.0.0.1:4100:4000"]
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads

  # Mismo código que la API (bind mount); compila a dist-worker/ para no pisar el dist/ de la API
  worker:
    image: jurisglobal-worker-dev
    build:
      target: dev
    restart: "no"
    command: ["npm", "run", "start:worker:dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules

  web:
    image: jurisglobal-web-dev
    build:
      target: dev
    restart: "no"
    environment:
      BACKEND_INTERNAL_URL: http://api:4000
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
      NEXT_PUBLIC_WHATSAPP_MESSAGE: ${NEXT_PUBLIC_WHATSAPP_MESSAGE:-}
      NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
      NEXT_PUBLIC_NIT_INFO: ${NEXT_PUBLIC_NIT_INFO:-}
    ports: ["127.0.0.1:3100:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
