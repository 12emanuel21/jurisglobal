# JurisGlobal · instancia AISLADA (no comparte contenedores, red, volúmenes ni BD con KovalCloud).
# Usar SIEMPRE el Makefile (fija -p jurisglobal):
#   make up        producción (imágenes compiladas)
#   make dev       desarrollo con hot-reload (+ docker-compose.dev.yml, puertos de depuración en 127.0.0.1)
#
# Puertos en el host (todos en 127.0.0.1; KovalCloud usa 80, 3030, 4000, 5000, 5432):
#   8088 nginx (prod y dev) · solo dev: 4100 api · 3100 web · 55432 postgres · 56379 redis
# Secretos en .env (no versionado; ver .env.example).

name: jurisglobal

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-jg_admin}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-jurisglobal}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}@redis:6379
  PORT: "4000"
  TZ: America/Bogota

services:
  db:
    image: postgres:16-alpine
    container_name: jurisglobal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-jurisglobal}
      TZ: America/Bogota
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [jg_net]

  redis:
    image: redis:7-alpine
    container_name: jurisglobal_redis
    restart: unless-stopped
    # noeviction: BullMQ (masivos) no debe perder trabajos por falta de memoria · AOF: sobrevive a reinicios
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [jg_net]

  api:
    build:
      context: ./backend
      target: prod
    container_name: jurisglobal_api
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    expose: ["4000"]
    volumes:
      # Adjuntos de WhatsApp (imágenes, notas de voz, PDFs): privados, se sirven con sesión
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [jg_net]

  web:
    build:
      context: ./frontend
      target: prod
      # Datos públicos de contacto: Next los incrusta al compilar (ver .env.example)
      args:
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_WHATSAPP_MESSAGE: ${NEXT_PUBLIC_WHATSAPP_MESSAGE:-}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_NIT_INFO: ${NEXT_PUBLIC_NIT_INFO:-}
    container_name: jurisglobal_web
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:4000
    expose: ["3000"]
    depends_on: [api]
    networks: [jg_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: jurisglobal_nginx
    restart: unless-stopped
    ports:
      # Solo loopback. Desde Internet: Cloudflare Tunnel (ver docs/02, Etapa 7)
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_HOST_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]
    networks: [jg_net]

volumes:
  pg_data:
    name: jurisglobal_pg_data
  redis_data:
    name: jurisglobal_redis_data
  uploads:
    name: jurisglobal_uploads

networks:
  jg_net:
    name: jurisglobal_net
    driver: bridge
