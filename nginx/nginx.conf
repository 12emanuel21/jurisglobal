# nginx de JurisGlobal (adaptado de nginx.prod.conf de KovalCloud): entrada única de la instancia.
#   /api/        -> api:4000 (se quita el prefijo /api)
#   /webhooks/whatsapp, /meta/ -> api:4000 (webhook de Meta, ruta y cuerpo intactos: la firma HMAC usa el body crudo)
#   /socket.io/  -> api:4000 (tiempo real del panel)
#   /            -> web:3000 (Next.js: web pública + panel)
# No se publica uploads/: los adjuntos de WhatsApp solo se sirven con sesión por /api.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DNS interno de Docker: re-resuelve api/web cuando se recrean (evita 502 tras un rebuild)
resolver 127.0.0.11 valid=10s ipv6=off;

# Límites por IP (además de los del backend)
limit_req_zone $binary_remote_addr zone=jg_public:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=jg_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=jg_webhook:10m rate=600r/m;
limit_req_status 429;

upstream jg_api {
    zone jg_api 64k;
    server api:4000 resolve;
    keepalive 16;
}

upstream jg_web {
    zone jg_web 64k;
    server web:3000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    # IP real: cloudflared envía CF-Connecting-IP; solo se confía si viene de redes internas
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Formulario unificado de leads (además del límite por IP del backend)
    location = /api/leads {
        limit_req zone=jg_public burst=5 nodelay;
        proxy_pass http://jg_api/leads;
        proxy_set_header Connection "";
    }

    # Configuración pública (landing y bot)
    location /api/public/ {
        limit_req zone=jg_public burst=5 nodelay;
        proxy_pass http://jg_api/public/;
        proxy_set_header Connection "";
    }

    location /api/auth/ {
        limit_req zone=jg_auth burst=10 nodelay;
        proxy_pass http://jg_api/auth/;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://jg_api/;
        proxy_set_header Connection "";
    }

    # Webhook de WhatsApp Cloud API (URL a registrar en Meta) y su alias de la Etapa 1
    location = /webhooks/whatsapp {
        limit_req zone=jg_webhook burst=100 nodelay;
        proxy_pass http://jg_api/webhooks/whatsapp;
        proxy_set_header Connection "";
    }

    location /meta/ {
        limit_req zone=jg_webhook burst=100 nodelay;
        proxy_pass http://jg_api/meta/;
        proxy_set_header Connection "";
    }

    location /socket.io/ {
        proxy_pass http://jg_api/socket.io/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://jg_web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
